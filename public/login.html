<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add(localStorage.getItem('mode') === 'light' ? 'light' : 'dark');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Buraza Micro Finance</title>
  <link rel="stylesheet" href="style.css?v=20261116-bmf-redesign">
</head>
<body>
  <div id="bmfToast" class="bmf-toast" role="status" aria-live="polite"></div>
  <button type="button" class="icon-btn theme-float" id="modeBtn" aria-label="Switch to light theme">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand-lockup">
        <strong>Buraza Micro Finance</strong>
        <span>Sign in to your account</span>
      </div>
      <form id="loginForm" class="auth-form">
        <div class="method-toggle" role="radiogroup" aria-label="Sign in with">
          <label><input type="radio" name="loginMethod" value="username" checked> Username</label>
          <label><input type="radio" name="loginMethod" value="email"> Email</label>
        </div>
        <label class="field-label" id="identifierLabel" for="email">Username</label>
        <input type="text" id="email" class="auth-input" placeholder="Username" required autocomplete="username">
        <label class="field-label" for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Password" required class="auth-input" autocomplete="current-password">
          <svg id="togglePass" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <label class="check-row"><input type="checkbox" id="requireOtp"> <span>Email me a one-time code</span></label>
        <button type="submit" class="enter-btn">Sign in</button>
        <div class="auth-links">
          <a href="/forgot-password">Forgot password?</a>
          <a href="/">Apply for a loan</a>
        </div>
      </form>
      <form id="otpForm" class="auth-form hidden">
        <p id="otpSentTo" class="message-text"></p>
        <label class="field-label" for="otp">One-time code</label>
        <input type="text" id="otp" placeholder="Code from your email" required class="auth-input" autocomplete="one-time-code" inputmode="numeric">
        <button type="submit" class="enter-btn">Verify code</button>
        <button type="button" id="backToLogin" class="toggle-mode">Back</button>
      </form>
      <div class="loader" id="loader"><span></span><span></span><span></span></div>
      <p id="message" class="message-text"></p>
    </section>
  </main>
  <script>
    const SUN = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MOON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
    function applyTheme(theme) {
      const active = theme === 'light' ? 'light' : 'dark';
      document.documentElement.classList.remove('dark', 'light');
      document.body.classList.remove('dark', 'light');
      document.documentElement.classList.add(active);
      document.body.classList.add(active);
      const btn = document.getElementById('modeBtn');
      if (btn) {
        btn.innerHTML = active === 'light' ? MOON : SUN;
        btn.setAttribute('aria-label', active === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
      }
    }
    applyTheme(localStorage.getItem('mode') || 'dark');
    document.getElementById('modeBtn').addEventListener('click', () => {
      const next = document.body.classList.contains('dark') ? 'light' : 'dark';
      localStorage.setItem('mode', next);
      applyTheme(next);
    });

    const staffRoles = ['admin', 'store_admin', 'franchise_admin'];
    function destinationFor(role) {
      return staffRoles.includes(role) ? '/admin' : '/account';
    }
    const savedRole = localStorage.getItem('userRole');
    if (localStorage.getItem('deviceToken') && savedRole) {
      window.location.replace(destinationFor(savedRole));
    }

    const passInput = document.getElementById('password');
    document.getElementById('togglePass').addEventListener('click', () => {
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });
    document.querySelectorAll('input[name="loginMethod"]').forEach(input => {
      input.addEventListener('change', () => {
        if (!input.checked) return;
        const emailMode = input.value === 'email';
        const field = document.getElementById('email');
        field.placeholder = emailMode ? 'Email' : 'Username';
        field.autocomplete = emailMode ? 'email' : 'username';
        document.getElementById('identifierLabel').textContent = emailMode ? 'Email' : 'Username';
      });
    });

    let pendingEmail = '';
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      document.getElementById('loader').classList.add('active');
      document.getElementById('message').textContent = '';
      const identifier = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const requireOtp = document.getElementById('requireOtp').checked;
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, requireOtp })
        });
        const data = await res.json();
        document.getElementById('loader').classList.remove('active');
        if (data.deviceToken && data.message === 'Login successful.') {
          localStorage.setItem('username', data.username || '');
          localStorage.setItem('userEmail', data.email || identifier);
          localStorage.setItem('userRole', data.role || 'user');
          localStorage.setItem('deviceToken', data.deviceToken);
          const nextPage = destinationFor(data.role);
          localStorage.setItem('lastAppPage', nextPage);
          window.location.href = nextPage;
          return;
        }
        if (data.otpSentTo) {
          pendingEmail = data.email || identifier;
          document.getElementById('otpSentTo').textContent = `Code sent to ${data.otpSentTo}`;
          document.getElementById('loginForm').classList.add('hidden');
          document.getElementById('otpForm').classList.remove('hidden');
          document.getElementById('otp').focus();
          return;
        }
        document.getElementById('message').textContent = data.error || 'Sign in failed.';
      } catch (err) {
        document.getElementById('loader').classList.remove('active');
        document.getElementById('message').textContent = 'Connection error. Please try again.';
      }
    });

    document.getElementById('otpForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      document.getElementById('loader').classList.add('active');
      try {
        const res = await fetch('/login/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, otp: document.getElementById('otp').value.trim() })
        });
        const data = await res.json();
        document.getElementById('loader').classList.remove('active');
        if (data.message === 'Login successful.') {
          localStorage.setItem('username', data.username || '');
          localStorage.setItem('userEmail', data.email || pendingEmail);
          localStorage.setItem('userRole', data.role || 'user');
          localStorage.setItem('deviceToken', data.deviceToken);
          const nextPage = destinationFor(data.role);
          localStorage.setItem('lastAppPage', nextPage);
          window.location.href = nextPage;
          return;
        }
        document.getElementById('message').textContent = data.error || 'The code could not be verified.';
      } catch (err) {
        document.getElementById('loader').classList.remove('active');
        document.getElementById('message').textContent = 'Connection error. Please try again.';
      }
    });

    document.getElementById('backToLogin').addEventListener('click', () => {
      document.getElementById('otpForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('message').textContent = '';
    });
  </script>
</body>
</html>
