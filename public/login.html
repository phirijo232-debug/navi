<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Pryme Vertex — Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .eye-icon { position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; width:20px; height:20px; opacity:0.6; }
    .eye-icon:hover { opacity:1; }
    .input-wrap { position:relative; width:100%; }
    .input-wrap input { width:100%; padding-right:36px; }
    .auth-form { display:flex; flex-direction:column; gap:12px; width:90%; max-width:320px; margin:0 auto; }
    .auth-input { padding:12px; border-radius:4px; border:1px solid rgba(255,255,255,0.2); background:transparent; color:inherit; width:100%; font-size:16px; box-sizing:border-box; }
    body.light .auth-input { border-color:rgba(0,0,0,0.2); color:#06141B; }
  </style>
</head>
<body>
  <div id="bmfToast" class="bmf-toast" role="status" aria-live="polite"></div>
  <a href="index.html" class="toggle-mode back-corner">← Back</a>
  <button class="toggle-mode" id="modeBtn">Switch Mode</button>

  <div class="landing">
    <h1 class="brand">Pryme Vertex</h1>
    <p class="tagline">Welcome Back</p>

    <form id="loginForm" class="auth-form">
      <input type="email" id="email" placeholder="Email" required class="auth-input" autocomplete="email">
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Password" required class="auth-input" autocomplete="current-password">
        <svg id="togglePass" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <button type="submit" class="enter-btn">Login</button>
      <a href="forgot-password.html" class="toggle-mode helper-link">Forgot Password?</a>
    </form>

    <form id="otpForm" class="auth-form hidden">
      <p id="otpSentTo" class="message-text"></p>
      <input type="text" id="otp" placeholder="Enter OTP from email" required class="auth-input" autocomplete="one-time-code" inputmode="numeric">
      <button type="submit" class="enter-btn">Verify OTP</button>
      <button type="button" id="backToLogin" class="toggle-mode">Back</button>
    </form>

    <div class="loader" id="loader"><span></span><span></span><span></span></div>
    <p id="message" class="message-text"></p>
  </div>

  <script>
    let bmfToastTimer;
    function bmfSuccess(message) {
      const toast = document.getElementById('bmfToast');
      if (!toast) return;
      toast.textContent = `BMF success: ${message}`;
      toast.classList.add('visible');
      clearTimeout(bmfToastTimer);
      bmfToastTimer = setTimeout(() => toast.classList.remove('visible'), 4000);
    }
    function applyTheme(theme) {
      document.documentElement.classList.remove('dark', 'light');
      document.body.classList.remove('dark', 'light');
      document.documentElement.classList.add(theme);
      document.body.classList.add(theme);
    }

    function toggleTheme() {
      const nextMode = document.body.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(nextMode);
      localStorage.setItem('mode', nextMode);
    }

    const savedMode = localStorage.getItem('mode') || 'dark';
    const lastAppPage = localStorage.getItem('lastAppPage');
    const activeDeviceToken = localStorage.getItem('deviceToken');

    if (activeDeviceToken && lastAppPage && ['dashboard.html', 'user.html'].includes(lastAppPage)) {
      window.location.replace(lastAppPage);
    }

    applyTheme(savedMode);

    document.getElementById('modeBtn').addEventListener('click', toggleTheme);

    let pendingEmail = '';
    const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    const toggle = document.getElementById('togglePass');
    const passInput = document.getElementById('password');
    let visible = false;

    toggle.addEventListener('click', function() {
      visible = !visible;
      passInput.type = visible ? 'text' : 'password';
      toggle.innerHTML = visible ? eyeOpen : eyeClosed;
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('loader').classList.add('active');
      document.getElementById('message').textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        document.getElementById('loader').classList.remove('active');
        document.getElementById('message').textContent = data.message || data.error;

        if (data.message) {
          bmfSuccess(data.message);
          pendingEmail = email;
          localStorage.setItem('userEmail', email);
          document.getElementById('otpSentTo').textContent = `OTP sent to: ${email}`;
          document.getElementById('loginForm').classList.add('hidden');
          document.getElementById('otpForm').classList.remove('hidden');
          document.getElementById('otp').focus();
        }
      } catch (err) {
        document.getElementById('loader').classList.remove('active');
        document.getElementById('message').textContent = 'Connection error. Please try again.';
      }
    });

    document.getElementById('otpForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('loader').classList.add('active');

      const otp = document.getElementById('otp').value.trim();

      try {
        const res = await fetch('/login/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, otp })
        });
        const data = await res.json();
        document.getElementById('loader').classList.remove('active');
        document.getElementById('message').textContent = data.message || data.error;

        if (data.message === 'Login successful.') {
          document.getElementById('message').textContent = 'BMF success: Login verified. Opening your dashboard…';
          bmfSuccess('Login verified. Opening your dashboard…');
          localStorage.setItem('username', data.username);
          localStorage.setItem('userEmail', pendingEmail);
          localStorage.setItem('userRole', data.role);
          localStorage.setItem('deviceToken', data.deviceToken);
          const preferredMode = localStorage.getItem('mode') || 'dark';
          const nextPage = data.role === 'admin' ? 'dashboard.html' : 'user.html';
          localStorage.setItem('lastAppPage', nextPage);
          applyTheme(preferredMode);
          localStorage.setItem('justLoggedIn', 'true');
          setTimeout(() => { window.location.href = nextPage; }, 650);
        }
      } catch (err) {
        document.getElementById('loader').classList.remove('active');
        document.getElementById('message').textContent = 'Connection error. Please try again.';
      }
    });

    document.getElementById('backToLogin').addEventListener('click', function() {
      document.getElementById('otpForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('message').textContent = '';
    });
  </script>
</body>
</html>
