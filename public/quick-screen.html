<html lang="en">
<head>

<div class="qs-page">

    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--qs-bg); color: var(--qs-text); }
    .qs-page { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; min-height: 100vh; display: flex; flex-direction: column; }

      <div class="qs-field"><label class="qs-label-required">NRC Front <span style="color:var(--qs-error)">*</span></label><div class="qs-file-zone" id="zoneNrcFront"><div class="qs-file-icon">📷</div><div class="qs-file-text">Choose NRC Front photo</div><input type="file" id="nrcFront" accept="image/jpeg,image/png,image/webp" required></div><div id="fileNameNrcFront" class="qs-file-name qs-hidden"></div></div>
      <div class="qs-field"><label class="qs-label-required">NRC Back <span style="color:var(--qs-error)">*</span></label><div class="qs-file-zone" id="zoneNrcBack"><div class="qs-file-icon">📷</div><div class="qs-file-text">Choose NRC Back photo</div><input type="file" id="nrcBack" accept="image/jpeg,image/png,image/webp" required></div><div id="fileNameNrcBack" class="qs-file-name qs-hidden"></div></div>

      <div class="qs-field"><label>Collateral Back <span style="color:var(--qs-text-muted)">(optional)</span></label><div class="qs-file-zone" id="zoneCollateralBack"><div class="qs-file-icon">📷</div><div class="qs-file-text">Choose Collateral Back photo</div><input type="file" id="collateralBack" accept="image/jpeg,image/png,image/webp"></div><div id="fileNameCollateralBack" class="qs-file-name qs-hidden"></div></div>
    </section>

    <label class="qs-checkbox"><input type="checkbox" id="terms" required><label><span class="qs-label-bold">I agree to the BMF terms and conditions</span> and confirm the information provided is accurate.</label></label>
    <button type="submit" id="applyBtn" class="qs-submit-btn">Submit Application</button>
    <div id="qsLoader" style="display:none;justify-content:center;gap:8px;margin-top:10px;"><div style="width:8px;height:8px;background:var(--qs-blue);border-radius:50%;animation:qs-bounce 0.8s infinite alternate"></div><div style="width:8px;height:8px;background:var(--qs-blue);border-radius:50%;animation:qs-bounce 0.8s infinite alternate 0.15s"></div><div style="width:8px;height:8px;background:var(--qs-blue);border-radius:50%;animation:qs-bounce 0.8s infinite alternate 0.3s"></div></div>

  <div id="qsSuccess" class="qs-success-screen">
    <div class="qs-success-icon">✓</div>
    <h2>Application Submitted!</h2>

</div>

  <div id="qsToast" class="qs-toast"></div>

  <script>
    let selectedUrgency = 'standard';
    let selectedMode = 'weeks';
    const params = new URLSearchParams(window.location.search);
    const preEmail = params.get('email') || '';
    const preName = params.get('name') || '';
    if (preEmail) { document.getElementById('email').value = preEmail; document.getElementById('email').readOnly = true; document.getElementById('email').style.opacity = '0.6'; }
    if (preName) { document.getElementById('fullName').value = preName; }
    document.querySelectorAll('[data-urgency]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-urgency]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); selectedUrgency = btn.dataset.urgency; updateEstimate();
      });
    });
    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); selectedMode = btn.dataset.mode;
        document.getElementById('weeksMode').classList.toggle('qs-hidden', selectedMode !== 'weeks');
        document.getElementById('dateMode').classList.toggle('qs-hidden', selectedMode === 'weeks');
        updateEstimate();
      });
    });
    <section class="qs-section">
      <h2>📄 Documents</h2>
      <div style="font-size:13px;color:var(--qs-text-muted);margin-bottom:16px;">Upload clear photos of your documents.</div>
    .qs-step-label { position: absolute; top: -24px; left: 0; width: 100%; text-align: center; font-size: 11px; color: var(--qs-text-muted); font-weight: 600; text-transform: uppercase; }
    ['nrcFront','nrcBack','collateralFront','collateralBack'].forEach(id => {
      const input = document.getElementById(id);
      const zone = document.getElementById('zone' + id.charAt(0).toUpperCase() + id.slice(1));
      const nameEl = document.getElementById('fileName' + id.charAt(0).toUpperCase() + id.slice(1));
      input.addEventListener('change', () => {
        if (input.files[0]) { zone.classList.add('has-file'); nameEl.textContent = input.files[0].name; nameEl.classList.remove('qs-hidden'); }
        else { zone.classList.remove('has-file'); nameEl.textContent = ''; nameEl.classList.add('qs-hidden'); }
      });
    });
    const WEEKLY_RATES = { 1: 0.10, 2: 0.16, 3: 0.24, 4: 0.32 };
    const URGENCY_HOURS = { standard: 48, urgent: 24, emergency: 4 };
    function updateEstimate() {
      const amount = Number(document.getElementById('loanAmount').value) || 0;
      const weeks = parseInt(document.getElementById('loanTenure').value, 10) || 1;
      const rate = WEEKLY_RATES[weeks] ?? 0.10;
      const interest = amount * rate; const total = amount + interest;
    function showToast(msg, kind = 'success') {
      const t = document.getElementById('qsToast');
      t.textContent = msg; t.className = 'qs-toast ' + kind; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 4000);
    }
    function setMessage(text, isError) {
      const m = document.getElementById('qsMessage');
      m.textContent = text; m.className = 'qs-message ' + (isError ? 'error' : '');
    }
    document.getElementById('applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('applyBtn'); const loader = document.getElementById('qsLoader'); setMessage('');
      const formData = new FormData();
      formData.append('fullName', document.getElementById('fullName').value.trim());
      formData.append('email', document.getElementById('email').value.trim());
      formData.append('nrcNumber', document.getElementById('nrcNumber').value.trim());
      formData.append('phone', document.getElementById('phone').value.trim());
      formData.append('product', document.getElementById('loanProduct').value);
      formData.append('amount', document.getElementById('loanAmount').value);
      formData.append('urgency', selectedUrgency);
      if (selectedMode === 'weeks') { formData.append('tenureWeeks', document.getElementById('loanTenure').value); }
      else { formData.append('dueDate', document.getElementById('loanDueDate').value); }
      formData.append('agreedToTerms', 'true'); formData.append('source', 'quick_screen');
      const nrcFront = document.getElementById('nrcFront').files[0];
      const nrcBack = document.getElementById('nrcBack').files[0];
      const collFront = document.getElementById('collateralFront').files[0];
      const collBack = document.getElementById('collateralBack').files[0];
      if (nrcFront) formData.append('nrcFront', nrcFront);
      if (nrcBack) formData.append('nrcBack', nrcBack);
      if (collFront) formData.append('collateralFront', collFront);
      if (collBack) formData.append('collateralBack', collBack);
      btn.disabled = true; loader.style.display = 'flex';
      try {
        const res = await fetch('/api/apply', { method: 'POST', body: formData });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { setMessage(data.error || 'Submission failed.', true); showToast(data.error || 'Submission failed.', 'error'); return; }
        document.getElementById('applyForm').style.display = 'none';
        document.getElementById('qsSuccess').style.display = 'block';
        document.getElementById('qsSuccessName').textContent = formData.get('fullName');
        document.getElementById('qsSuccessId').textContent = data.applicationId;
        showToast('Application submitted successfully!');
      } catch (err) { setMessage('Connection error. Please try again.', true); showToast('Connection error. Please try again.', 'error'); }
      finally { btn.disabled = false; loader.style.display = 'none'; }
    });
  </script>
