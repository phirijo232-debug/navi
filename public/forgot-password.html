<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pryme Vertex — Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .eye-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; width: 20px; height: 20px; opacity: 0.6; }
    .eye-icon:hover { opacity: 1; }
    .input-wrap { position: relative; }
    .input-wrap input { width: 100%; padding-right: 36px; }
  </style>
</head>
<body>
  <a href="login.html" class="toggle-mode back-corner">← Back</a>
  <button class="toggle-mode" id="modeBtn">Switch Mode</button>

  <div class="landing">
    <h1 class="brand">Pryme Vertex</h1>
    <p class="tagline">Reset Your Password</p>

    <form id="requestForm" class="auth-form">
      <input type="email" id="email" placeholder="Your registered email" required class="auth-input">
      <button type="submit" class="enter-btn">Send OTP</button>
    </form>

    <form id="resetForm" class="auth-form hidden">
      <p id="otpSentTo" class="message-text"></p>
      <input type="text" id="otp" placeholder="Enter OTP from email" required class="auth-input">
      <div class="input-wrap">
        <input type="password" id="newPassword" placeholder="New Password" required class="auth-input">
        <svg id="toggle1" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div class="input-wrap">
        <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" required class="auth-input">
        <svg id="toggle2" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <button type="submit" class="enter-btn">Reset Password</button>
      <button type="button" id="requestOtpBtn" class="toggle-mode">Request OTP</button>
      <p id="cooldownMsg" class="message-text"></p>
    </form>

    <div class="loader" id="loader"><span></span><span></span><span></span></div>
    <p id="message" class="message-text"></p>
  </div>

  <script>
    function applyTheme(theme) {
      document.documentElement.classList.remove('dark', 'light');
      document.body.classList.remove('dark', 'light');
      document.documentElement.classList.add(theme);
      document.body.classList.add(theme);
    }

    function toggleTheme() {
      const nextMode = document.body.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(nextMode);
      localStorage.setItem('mode', nextMode);
    }

    const savedMode = localStorage.getItem('mode') || 'dark';
    applyTheme(savedMode);

    document.getElementById('modeBtn').addEventListener('click', toggleTheme);

    function animateTagline(selector) {
      const tagline = document.querySelector(selector);
      if (!tagline) return;
      const text = tagline.textContent.trim();
      tagline.innerHTML = '';
      text.split('').forEach((letter, index) => {
        const span = document.createElement('span');
        span.textContent = letter === ' ' ? '\u00A0' : letter;
        span.style.animationDelay = `${index * 0.05}s`;
        span.className = 'tagline-letter';
        tagline.appendChild(span);
      });
    }

    animateTagline('.tagline');

    let pendingEmail = '';
    let resendCount = 0;
    let cooldownActive = false;

    const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    function setupToggle(toggleId, inputId) {
      const toggle = document.getElementById(toggleId);
      const input = document.getElementById(inputId);
      let visible = false;
      toggle.addEventListener('click', function() {
        visible = !visible;
        input.type = visible ? 'text' : 'password';
        toggle.innerHTML = visible ? eyeOpen : eyeClosed;
      });
    }
    setupToggle('toggle1', 'newPassword');
    setupToggle('toggle2', 'confirmNewPassword');

    function startCooldown() {
      cooldownActive = true;
      let seconds = 120;
      const btn = document.getElementById('requestOtpBtn');
      const msg = document.getElementById('cooldownMsg');
      btn.disabled = true;

      const interval = setInterval(() => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        msg.textContent = `Wait ${mins}:${secs.toString().padStart(2, '0')} to request again`;
        seconds--;
        if (seconds < 0) {
          clearInterval(interval);
          cooldownActive = false;
          resendCount = 0;
          btn.disabled = false;
          msg.textContent = '';
        }
      }, 1000);
    }

    document.getElementById('requestForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('loader').classList.add('active');

      const email = document.getElementById('email').value;
      const res = await fetch('/password-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      document.getElementById('loader').classList.remove('active');
      document.getElementById('message').textContent = data.message || data.error;

      if (data.message) {
        pendingEmail = email;
        document.getElementById('otpSentTo').textContent = `OTP sent to: ${email}`;
        document.getElementById('requestForm').classList.add('hidden');
        document.getElementById('resetForm').classList.remove('hidden');
        document.getElementById('otp').focus();
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('loader').classList.add('active');

      const otp = document.getElementById('otp').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;
      const strengthRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?"{}|<>]).{8,}$/;

      if (newPassword !== confirmNewPassword) {
        document.getElementById('message').textContent = 'Passwords do not match.';
        document.getElementById('loader').classList.remove('active');
        return;
      }

      if (!strengthRegex.test(newPassword)) {
        document.getElementById('message').textContent = 'Password must be at least 8 characters and include uppercase, lowercase, number, and special character.';
        document.getElementById('loader').classList.remove('active');
        return;
      }

      const res = await fetch('/password-reset/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, otp, newPassword, confirmNewPassword })
      });
      const data = await res.json();

      document.getElementById('loader').classList.remove('active');
      document.getElementById('message').textContent = data.message || data.error;

      if (data.message === 'Password reset successfully. You can now login.') {
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    });

    document.getElementById('requestOtpBtn').addEventListener('click', async function() {
      if (cooldownActive) return;
      resendCount++;
      document.getElementById('loader').classList.add('active');

      const res = await fetch('/password-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail })
      });
      const data = await res.json();

      document.getElementById('loader').classList.remove('active');
      document.getElementById('message').textContent = data.message || data.error;

      if (resendCount >= 5) {
        startCooldown();
      }
    });
  </script>
</body>
</html>
